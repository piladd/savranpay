openapi: 3.0.3
info:
  title: SavranPay API
  version: 0.1.0
  description: Учебная спецификация API сервиса банковских переводов.
paths:
  /api/v1/auth/login:
    post:
      summary: Login with password and issue JWT pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Access token and refresh token issued
        "401":
          description: Invalid credentials
  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token and issue a new JWT pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Token pair refreshed
        "401":
          description: Refresh token is invalid or expired
  /api/v1/auth/logout:
    post:
      summary: Revoke a refresh token and close its session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: Session closed
  /api/v1/auth/me:
    get:
      summary: Return the current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile
        "401":
          description: Unauthorized
  /api/v1/auth/change-password:
    post:
      summary: Change current user password and revoke active sessions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed
        "400":
          description: Current password is invalid
  /api/v1/auth/sessions:
    get:
      summary: List current user sessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active and revoked sessions
  /health/live:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: Application process is alive
  /health/ready:
    get:
      summary: Readiness probe
      responses:
        "200":
          description: Application dependencies are ready
        "503":
          description: Dependency is unavailable
  /metrics:
    get:
      summary: Prometheus-compatible metrics
      responses:
        "200":
          description: Metrics in text/plain format
  /api/v1/admin/users:
    get:
      summary: List users for admin cabinet
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Users returned
    post:
      summary: Create user for admin cabinet
      security:
        - bearerAuth: []
      responses:
        "201":
          description: User created
  /api/v1/admin/users/{userId}:
    patch:
      summary: Update user profile and status
      security:
        - bearerAuth: []
      responses:
        "204":
          description: User updated
  /api/v1/admin/users/{userId}/roles:
    post:
      summary: Add role to user
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Role added
  /api/v1/admin/users/{userId}/roles/{role}:
    delete:
      summary: Remove role from user
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Role removed
  /api/v1/admin/users/{userId}/block:
    post:
      summary: Block user and revoke active sessions
      security:
        - bearerAuth: []
      responses:
        "204":
          description: User blocked
  /api/v1/admin/users/{userId}/unblock:
    post:
      summary: Unblock user
      security:
        - bearerAuth: []
      responses:
        "204":
          description: User unblocked
  /api/v1/aml/transfers/{transferId}/decision:
    post:
      summary: Record manual AML decision
      security:
        - bearerAuth: []
      responses:
        "202":
          description: AML decision accepted
  /api/v1/fraud/transfers/{transferId}/decision:
    post:
      summary: Record manual fraud decision
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Fraud decision accepted
  /api/v1/transfers:
    post:
      summary: Создать распоряжение на перевод
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - name: X-Customer-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransferRequest"
      responses:
        "202":
          description: Перевод создан и ожидает подтверждения
  /api/v1/transfers/{transferId}/confirm:
    post:
      summary: Подтвердить перевод
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmTransferRequest"
      responses:
        "200":
          description: Подтверждение обработано
  /api/v1/transfers/{transferId}:
    get:
      summary: Получить статус перевода
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Статус перевода
        "404":
          description: Перевод не найден
  /api/v1/transfers/{transferId}/unauthorized-claim:
    post:
      summary: Заявить об операции без согласия клиента
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Заявление принято
        "404":
          description: Перевод не найден
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          example: client@savranpay.local
        password:
          type: string
          format: password
          example: Client123!
    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    LogoutRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
    CreateTransferRequest:
      type: object
      required:
        - fromAccountId
        - recipient
        - amount
        - purpose
      properties:
        fromAccountId:
          type: string
          format: uuid
        recipient:
          $ref: "#/components/schemas/Recipient"
        amount:
          $ref: "#/components/schemas/Money"
        purpose:
          type: string
    Recipient:
      type: object
      required:
        - type
        - accountNumber
        - bankBic
        - name
      properties:
        type:
          type: string
          example: Account
        accountNumber:
          type: string
          example: "40817810000000000001"
        bankBic:
          type: string
          example: "044525225"
        name:
          type: string
          example: "Иван Иванов"
    Money:
      type: object
      required:
        - minorUnits
        - currency
      properties:
        minorUnits:
          type: integer
          format: int64
          example: 150000
        currency:
          type: string
          example: RUB
    ConfirmTransferRequest:
      type: object
      required:
        - confirmationType
        - signature
        - nonce
      properties:
        confirmationType:
          type: string
          example: TransactionSignature
        signature:
          type: string
        nonce:
          type: string
