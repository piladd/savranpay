name: CI — Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore BankTransfers.sln

      - name: Build
        run: dotnet build BankTransfers.sln --no-restore --configuration Release

      - name: Unit Tests
        run: >
          dotnet test tests/BankTransfers.UnitTests/BankTransfers.UnitTests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=unit-results.trx"
          --results-directory ./test-results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: ./test-results/*.trx

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore BankTransfers.sln

      - name: Build for security scan
        run: dotnet build BankTransfers.sln --no-restore --configuration Release

      - name: Security Tests
        run: >
          dotnet test tests/BankTransfers.SecurityTests/BankTransfers.SecurityTests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=security-results.trx"
          --results-directory ./test-results

      - name: Upload security test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-test-results
          path: ./test-results/*.trx

  vulnerability-scan:
    name: NuGet Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check for vulnerable packages
        run: dotnet list BankTransfers.sln package --vulnerable --include-transitive
