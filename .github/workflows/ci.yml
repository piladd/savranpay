name: CI — Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore SavranPay.sln

      - name: Build
        run: dotnet build SavranPay.sln --no-restore --configuration Release

      - name: Unit Tests
        run: >
          dotnet test tests/SavranPay.UnitTests/SavranPay.UnitTests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=unit-results.trx"
          --results-directory ./test-results

      - name: Integration Tests
        run: >
          dotnet test tests/SavranPay.IntegrationTests/SavranPay.IntegrationTests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=integration-results.trx"
          --results-directory ./test-results

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/savranpay-web/package-lock.json

      - name: Frontend install
        working-directory: frontend/savranpay-web
        run: npm ci

      - name: Frontend build
        working-directory: frontend/savranpay-web
        run: npm run build

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: ./test-results/*.trx

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SavranPay.sln

      - name: Build for security scan
        run: dotnet build SavranPay.sln --no-restore --configuration Release

      - name: Security Tests
        run: >
          dotnet test tests/SavranPay.SecurityTests/SavranPay.SecurityTests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=security-results.trx"
          --results-directory ./test-results

      - name: Upload security test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-test-results
          path: ./test-results/*.trx

  vulnerability-scan:
    name: NuGet Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check for vulnerable packages
        run: dotnet list SavranPay.sln package --vulnerable --include-transitive

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker images
        run: docker compose build backend worker frontend
